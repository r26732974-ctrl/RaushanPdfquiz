<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Quiz Converter & Detailed Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js for extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        };
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white">
                    <i data-lucide="file-text" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">PDF Quizzer AI</h1>
                    <p class="text-xs text-slate-400">PDF to Interactive Quiz & Analysis</p>
                </div>
            </div>
            <div id="quizTimerNav" class="hidden flex items-center gap-2 bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-sm font-semibold text-indigo-400">
                <i data-lucide="clock" class="w-4 h-4"></i>
                <span id="timerDisplay">00:00</span>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        <!-- 1. SETUP / UPLOAD VIEW -->
        <div id="setupView" class="space-y-6">
            <div class="text-center max-w-xl mx-auto space-y-2">
                <h2 class="text-3xl font-extrabold text-white">Apni PDF Upload Karein</h2>
                <p class="text-slate-400 text-sm">Pehle se bane sawal extract karein ya theory se naye MCQs banayein.</p>
            </div>

            <!-- Mode Selector -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl mx-auto">
                <label class="relative flex flex-col bg-slate-800/80 border-2 border-indigo-600 rounded-2xl p-4 cursor-pointer hover:bg-slate-800 transition shadow-lg">
                    <input type="radio" name="conversionMode" value="extract" checked class="peer sr-only" onchange="updateModeUI()">
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="scan-text" class="w-5 h-5 text-indigo-400"></i>
                        <span class="font-bold text-slate-200">Mode 1: Existing Q&A</span>
                    </div>
                    <p class="text-xs text-slate-400">PDF me pehle se diye gaye Questions, Options aur Answer Key ko extract karein.</p>
                </label>

                <label class="relative flex flex-col bg-slate-800/80 border-2 border-slate-700 rounded-2xl p-4 cursor-pointer hover:bg-slate-800 transition">
                    <input type="radio" name="conversionMode" value="generate" class="peer sr-only" onchange="updateModeUI()">
                    <div class="flex items-center gap-3 mb-2">
                        <i data-lucide="sparkles" class="w-5 h-5 text-indigo-400"></i>
                        <span class="font-bold text-slate-200">Mode 2: AI Generator</span>
                    </div>
                    <p class="text-xs text-slate-400">Theory ya notes padh kar auto-generated naye MCQs banayein.</p>
                </label>
            </div>

            <!-- Upload Box -->
            <div class="max-w-2xl mx-auto bg-slate-800/50 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <div id="dropZone" class="border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-xl p-8 text-center bg-slate-900/50 cursor-pointer transition">
                    <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
                    <i data-lucide="upload-cloud" class="w-12 h-12 text-indigo-400 mx-auto mb-3"></i>
                    <p class="font-medium text-slate-200 mb-1">Click karein ya PDF Drag & Drop karein</p>
                    <p class="text-xs text-slate-500">Supports text PDF documents</p>
                </div>

                <div class="my-4 text-center text-xs text-slate-500 uppercase tracking-widest font-semibold">Ya fir Text Paste Karein</div>

                <textarea id="manualTextInput" placeholder="Yahan apna text ya questions paste karein..." class="w-full h-32 bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>

                <button onclick="processInput()" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-6 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
                    <i data-lucide="play" class="w-5 h-5"></i>
                    <span>Quiz Start Karein</span>
                </button>
            </div>
        </div>

        <!-- 2. QUIZ PLAYER VIEW -->
        <div id="quizView" class="hidden max-w-3xl mx-auto w-full space-y-6">
            <!-- Progress Bar -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs text-slate-400 font-semibold">
                    <span id="questionTracker">Question 1 of 10</span>
                    <span id="progressPercent">10%</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
                </div>
            </div>

            <!-- Question Card -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-
